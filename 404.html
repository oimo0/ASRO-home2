<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>404 | ASRO</title><script>
(()=>{try{
 const parts=location.pathname.split('/').filter(Boolean),kuup=parts.findIndex(x=>x.toLowerCase()==='kuup');
 if(kuup>=0&&parts.length===kuup+3&&parts[kuup+1]&&parts[kuup+2]){
  const user=decodeURIComponent(parts[kuup+1]),site=decodeURIComponent(parts[kuup+2]),pretty=location.pathname;
  location.replace('/AI/kuup/site.html?user='+encodeURIComponent(user)+'&site='+encodeURIComponent(site)+'&pretty='+encodeURIComponent(pretty)+location.hash);
 }
}catch{}})();
</script><link rel="stylesheet" href="/site.css"></head><body><section class="hero" style="min-height:100vh"><p class="eyebrow">ERROR / 404</p><h1>Not<br><em>found.</em></h1><p class="lead">このページはまだ、未来にないみたい。</p><a class="btn" href="/">ASRO HOME →</a></section></body></html>
